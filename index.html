<title>문제지메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#1f2a44; --ink2:#46506a; --mute:#7a8296; --line:#e3e1db; --bg:#f6f4ef; --card:#fff; --soft:#f1efea; --soft2:#ebe8e1; --sel:#eef0f5; --okbg:#eef6f1; --line2:#cfcac0;
  --solid:#1f2a44; --solid-fg:#fff; --glass:rgba(246,244,239,.9); --veil:rgba(246,244,239,.96);
  --acc:#e2683c; --acc2:#fbe9e1; --ok:#2f8f5b; --bad:#c8402f;
  --r:14px; --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.topbar{position:sticky;top:0;z-index:20;background:var(--solid);color:var(--solid-fg);display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--acc);font-style:normal;font-size:14px}
.tbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:13.5px;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.stepper{display:flex;gap:4px;margin:2px 0 20px}
.stepper button{flex:1;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--mute);font-size:11.5px;font-weight:600}
.stepper button:disabled{cursor:default}
.stepper .bar{height:4px;border-radius:4px;background:var(--line);margin-bottom:6px}
.stepper .on{color:var(--ink)} .stepper .on .bar{background:var(--acc)}
.stepper .done .bar{background:var(--ink)}
h2{font-size:22px;letter-spacing:-.5px;margin:0 0 6px;line-height:1.35}
.sub{color:var(--ink2);margin:0 0 18px;font-size:14.5px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-t{font-weight:700;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t small{font-weight:500;color:var(--mute);font-size:12.5px}
label.lb{display:block;font-weight:600;font-size:13.5px;margin:12px 0 6px;color:var(--ink2)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:44px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 16px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
a.btn{color:var(--ink);text-decoration:none}
.btn.pri{background:var(--solid);color:var(--solid-fg);border-color:var(--solid)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);box-shadow:0 -6px 16px rgba(20,24,36,.06);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navbar .btn{flex:1}
.navbar .btn.back{flex:0 0 auto}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--acc);background:var(--acc2)}
.drop .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop p{color:var(--mute);font-size:13px;margin:12px 0 0}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.file .th{width:54px;height:54px;border-radius:8px;background:var(--soft) center/cover;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
.file .th.pdf{background:#c8402f}
.file .meta{flex:1;min-width:0}
.file .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .inf{font-size:12.5px;color:var(--mute);margin-top:2px}
.file .rng{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.file .rng input{padding:5px 8px;font-size:13px;width:140px}
.xbtn{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--ink2);flex:0 0 auto}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;position:relative}
.chip b{display:block;font-size:14.5px}
.chip span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.chip.on{border-color:var(--ink);background:var(--sel)}
.chip.off{opacity:.45;cursor:not-allowed}
.chip.on::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:800;color:var(--ink)}
.seg{display:flex;background:var(--soft2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{-webkit-appearance:none;appearance:none;flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;min-width:64px}
.seg button.on{background:var(--solid);color:var(--solid-fg);box-shadow:0 1px 3px rgba(0,0,0,.18);-webkit-text-fill-color:var(--solid-fg)}
.seg button:not(.on){-webkit-text-fill-color:var(--ink2)}
.num{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.num button{border:0;background:var(--soft);width:34px;height:36px;font-size:18px;cursor:pointer;color:var(--ink)}
.num input{border:0;width:52px;text-align:center;padding:6px 2px;border-radius:0;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.part{position:relative}
.part .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.part .tag{background:var(--solid);color:var(--solid-fg);font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 7px;letter-spacing:.3px}
.part .src{font-size:12px;color:var(--mute)}
.part input.ti{font-weight:700;font-size:16px}
.part textarea,.part input.cc{margin-top:6px;font-size:14px}
.part .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.ib{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--ink2);font-size:13px}
.ib:hover{background:var(--soft2)}
.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.55}
.warn{font-size:13.5px;color:#7a3a14;background:#fdf0e3;border:1px solid #f3d6bb;border-radius:10px;padding:10px 12px;line-height:1.55;margin-bottom:12px}
.err{color:var(--bad);font-size:13.5px}
.totalbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--solid);color:var(--solid-fg);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.totalbox .num{border-color:transparent}
.totalbox .num input,.totalbox .btn{color:var(--ink)}
.totalbox b{font-size:15px}
.typecnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.typecnt .it{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
/* question cards */
.qpart{font-weight:800;font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.qpart small{white-space:nowrap}
.qpart .tag{background:var(--acc);color:#fff;font-size:11.5px;border-radius:6px;padding:3px 7px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:10px}
.qcard .qmeta{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--sel);color:var(--ink)}
.badge.d{background:var(--soft);color:var(--ink2)}
.qcard .acts{display:flex;gap:6px;justify-content:flex-end;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.qcard .ansv{margin-top:10px;background:var(--okbg);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.qcard .ansv b{color:var(--ok)}
.failbox{background:var(--card);border:1px solid #f0c9c2;border-radius:var(--r);padding:12px 14px;margin:10px 0}
/* modal & loading */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,24,36,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin:0 0 4px;font-size:19px}
.modal ol{padding-left:20px;line-height:1.75;font-size:14px;margin:8px 0}
.loading{position:fixed;inset:0;z-index:60;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);overscroll-behavior:contain;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
html.busy,html.busy body{overflow:hidden}
.loading .lb2{max-width:380px;width:100%;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:sp 0.9s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading .t{font-weight:700;font-size:17px}
.loading .d{color:var(--ink2);font-size:14px;margin-top:10px;min-height:20px;line-height:1.5}
.prog{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:18px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .5s ease-out}
.loading .pinfo{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.loading .pinfo b{color:var(--acc);font-size:15px}
.loading .pnote{margin-top:14px;font-size:13px;color:var(--ink2);line-height:1.55;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--solid);color:var(--solid-fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hist{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hist .m{flex:1;min-width:0;cursor:pointer}
.hist .m b.mk{display:inline;color:var(--acc);font-size:inherit}
.hist .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .m span{font-size:12.5px;color:var(--mute)}
.pv-list{display:grid;gap:14px;justify-items:center;margin-top:16px}
.pv{box-shadow:0 2px 12px rgba(0,0,0,.12);background:#FFFFFF;overflow:hidden;position:relative}
.pv>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.dlrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlrow .btn.full{grid-column:1/-1}

/* ===== shared question rendering (preview + PDF) ===== */
.qx{line-height:1.62}
.qx .stem{word-break:keep-all;overflow-wrap:anywhere}
.qx .stem .n{font-weight:800;margin-right:4px}
.qx .passage{border:1px solid #444;padding:8px 11px;margin:7px 0;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.qx .bogi{border:1px solid #444;padding:14px 11px 8px;margin:12px 0 7px;position:relative}
.qx .bogi::before{content:"<보 기>";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-size:.88em;font-weight:700}
.qx .bogi.plain{padding-top:8px;margin-top:7px}
.qx .bogi.plain::before{display:none}
.qx .bogi div{padding-left:1.7em;text-indent:-1.7em;word-break:keep-all;overflow-wrap:anywhere}
.qx .match{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:7px 0;border:1px solid #444;padding:8px 11px}
.qx .match div{word-break:keep-all;overflow-wrap:anywhere}
.qx .choices{display:grid;gap:3px 12px;margin-top:6px}
.qx .choices.c2{grid-template-columns:1fr 1fr}
.qx .choices.c3{grid-template-columns:1fr 1fr 1fr}
.qx .choices.c5{grid-template-columns:repeat(5,1fr)}
.qx .choices div{padding-left:1.35em;text-indent:-1.35em;word-break:keep-all;overflow-wrap:anywhere}
.qx .oxbox{display:inline-block;margin-left:6px;font-weight:700;white-space:nowrap}
.qx .aline{border-bottom:1px solid #999;height:26px;margin-top:6px}
.qx .aline.lbl{border:0;height:auto;margin-top:8px;display:flex;gap:6px;align-items:flex-end}
.qx .aline.lbl span{white-space:nowrap;font-weight:600}
.qx .aline.lbl i{flex:1;border-bottom:1px solid #999;height:22px}
.qx .abox{border:1px solid #999;margin-top:7px}
.qx table.tb{border-collapse:collapse;margin:4px 0;font-size:.95em}
.qx table.tb td{border:1px solid #666;padding:3px 8px}

/* ===== A4 page (PDF) ===== */
#pageRender{position:fixed;left:-12000px;top:0;width:800px}
#printRoot{display:none}
.page{width:794px;height:1123px;background:#fff;color:#111;padding:50px 46px 54px;display:flex;flex-direction:column;position:relative;font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR","Nanum Gothic",sans-serif;font-size:13.4px;overflow:hidden}
.sheet-head{border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:18px;position:relative}
.sheet-head::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid #111}
.sh-top{display:flex;justify-content:space-between;font-size:12px;color:#444;font-weight:600}
.sh-title{font-size:25px;font-weight:800;text-align:center;margin:8px 0 10px;letter-spacing:-.5px;word-break:keep-all}
.sh-info{display:flex;justify-content:flex-end;gap:22px;font-size:12.5px;font-weight:600}
.sh-info span i{display:inline-block;width:86px;border-bottom:1px solid #111;margin-left:6px}
.sh-info span i.s{width:44px}
.cols{flex:1;min-height:0;display:flex;gap:30px}
.col{flex:1;min-width:0;overflow:hidden;position:relative}
.cols.two .col+.col{border-left:1px solid #bbb;padding-left:15px;margin-left:-15px}
.page .q{margin-bottom:24px}
.page.one{font-size:15px}
.page.one .q{margin-bottom:28px}
.page .part-head{font-weight:800;font-size:13.5px;background:#f0f0f0;border-left:5px solid #111;padding:6px 10px;margin:2px 0 14px}
.page .part-head small{font-weight:600;color:#555;margin-left:6px}
.page-foot{position:absolute;bottom:22px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:10.5px;color:#666;border-top:1px solid #ddd;padding-top:6px}
.page .ans-grid{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12.5px;table-layout:fixed}
.page .ans-grid td{border:1px solid #888;text-align:center;padding:4px 2px;word-break:break-all}
.page .ans-grid tr:first-child td{background:#f0f0f0;font-weight:700}
.page .ans-item{margin-bottom:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.page .ans-item .h{font-weight:800}
.page .ans-item .h em{font-style:normal;color:#b23a1e;margin-left:6px}
.page .ans-item .c{font-size:11.5px;color:#666;margin-left:6px;font-weight:600}
.page .ans-item .ex{margin-top:2px}
.page .ans-item .la{margin:3px 0 4px;padding:5px 9px;background:#f4f4f4;border-left:3px solid #b23a1e}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  #printRoot .page{page-break-after:always;break-after:page}
}

/* ===== 홈페이지 레이아웃 ===== */
body{background:var(--bg)}
header.site{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(0,0,0,.06);padding-top:env(safe-area-inset-top)}
header.site .in,footer.site .in{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
header.site .in{height:62px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.6px;flex:1;min-width:0}
.logo svg{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(226,104,60,.25))}
.logo b{color:var(--acc);font-weight:800}
.logo.sm{font-size:15px;flex:0 0 auto}.logo.sm svg{width:26px;height:26px;filter:none}
header.site nav{display:flex;align-items:center;gap:4px}
.nl{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
.nl:hover{background:rgba(31,42,68,.06);color:var(--ink)}
.nl.set{border:1px solid var(--line);background:var(--card)}
.nl .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--acc);display:none;box-shadow:0 0 0 2px var(--card)}
.nl .dot.on{display:block}
footer.site{border-top:1px solid var(--line);margin-top:30px;padding:26px 0 calc(110px + env(safe-area-inset-bottom))}
footer.site .in{flex-wrap:wrap;gap:8px 18px}
footer.site p{margin:0;color:var(--mute);font-size:12.5px;flex:1;min-width:240px;line-height:1.6}
body.on-home footer.site{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@media(max-width:520px){.hide-s{display:none}.nl{padding:8px 10px}}

/* hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 340px at 85% 10%,rgba(226,104,60,.16),transparent 70%),radial-gradient(500px 300px at 0% 100%,rgba(31,42,68,.07),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,42,68,.09) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:44px 20px 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.eyebrow i{width:18px;height:18px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;color:var(--acc);font-style:normal;font-size:11px}
.hero h1{font-size:46px;line-height:1.22;letter-spacing:-1.8px;margin:18px 0 16px;font-weight:800;word-break:keep-all}
.hero h1 em{font-style:normal;color:var(--acc);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:4px;height:12px;background:var(--acc2);z-index:-1;border-radius:3px}
.hero .lead{font-size:17px;line-height:1.7;color:var(--ink2);margin:0 0 26px;max-width:470px;word-break:keep-all}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div b{display:block;font-size:24px;letter-spacing:-.6px;color:var(--ink)}
.stats div span{font-size:13px;color:var(--mute);font-weight:600}
.mini-sheet{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
.mini-sheet span{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px}

/* upload panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 50px -24px rgba(31,42,68,.28),0 2px 6px rgba(31,42,68,.05);padding:22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h .n{width:28px;height:28px;border-radius:9px;background:var(--solid);color:var(--solid-fg);display:grid;place-items:center;font-weight:800;font-size:14px}
.panel-h b{font-size:17px;letter-spacing:-.3px}
.panel-h small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}
.panel .drop{border-radius:14px;padding:26px 14px;background:var(--soft)}
.drop .ic{width:46px;height:46px;border-radius:14px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;margin:0 auto 12px}
.drop .big{font-weight:700;font-size:15px;margin-bottom:14px}
.panel .go{width:100%;margin-top:14px;padding:14px;font-size:16px;border-radius:13px}
.keycta{display:flex;gap:12px;align-items:center;background:var(--solid);color:var(--solid-fg);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.keycta div{flex:1;font-size:13.5px;line-height:1.5}
.keycta b{display:block;font-size:14.5px}
.keycta .btn{background:var(--acc);border-color:var(--acc);color:#fff;white-space:nowrap}

/* sections */
.sec{max-width:1120px;margin:0 auto;padding:46px 20px 10px}
.sec-head{margin-bottom:22px}
.sec-head .k{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.4px}
.sec-head h3{font-size:28px;letter-spacing:-1px;margin:6px 0 0;line-height:1.3;word-break:keep-all}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}

@media(max-width:900px){

/* ===== 시작 안내 ===== */
.free{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--solid);color:var(--solid-fg);border-radius:22px;padding:26px 28px}
.free .k{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.4px}
.free h4{margin:6px 0 8px;font-size:22px;letter-spacing:-.5px;color:inherit}
.free p{margin:0;opacity:.8;font-size:14.5px;line-height:1.6;word-break:keep-all}
.fr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fr-chips span{font-size:12.5px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:4px 10px;opacity:.85}
.fr-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fr-side .btn{background:var(--acc);border-color:var(--acc);color:#fff;white-space:nowrap}
.free .by{margin:0!important;font-size:13px!important;opacity:.75}
.free .by b{color:inherit}

/* ===== 스위치 ===== */
.switch-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.switch-row span{flex:1}.switch-row b{display:block;font-size:15px}.switch-row small{display:block;font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.5}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch:checked{background:var(--ok)}.switch:checked::after{transform:translateX(20px)}

/* ===== 통계 ===== */
:root{--s1:#2a78d6;--s2:#eb6834;--grid:#e8e6e1;--tick:#7a8296}
body.dark{--s1:#3987e5;--s2:#d95926;--grid:#253043;--tick:#7c879d}
.statbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.statbar .seg{flex:0 0 auto}.statbar .seg button{min-width:60px}
.sgrp{font-size:12.5px;font-weight:800;color:var(--mute);margin:18px 0 8px;letter-spacing:.3px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{display:block;font-size:12px;color:var(--mute);font-weight:600}
.tile b{display:block;font-size:20px;letter-spacing:-.4px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.tile.hot{border-color:var(--acc)}.tile.hot b{color:var(--acc)}
.card.profit{margin-top:14px}
.pf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.pf-h b{flex:1;font-size:15px}
.pf-h label{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}.pf-h input{width:70px;padding:5px 8px}
.pf-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.pf-row span{color:var(--ink2)}.pf-row b{font-variant-numeric:tabular-nums}
.pf-row.tot{border-bottom:0;font-size:16px}.pf-row.tot b{color:var(--ok)}.pf-row.tot b.neg{color:var(--bad)}
.card.profit .note{margin-top:8px}
.card.chart,.two .card{margin-top:12px;margin-bottom:0}
.ch-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ch-h b{font-size:15px}.ch-h small{color:var(--mute);font-size:12.5px}
.legend{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.key.s1,.lk2.s1,.segbar .s1,.hb .ht i{background:var(--s1)}.key.s2,.lk2.s2,.segbar .s2{background:var(--s2)}
.ch-wrap{position:relative}
.ch-wrap{min-height:170px}.ch-wrap svg{display:block;overflow:visible}
.card.chart{position:relative}
.ch-wrap .grid{stroke:var(--grid);stroke-width:1}
.ch-wrap .tick{fill:var(--tick);font-size:11px;font-family:var(--font)}
.ch-wrap .bar.s1{fill:var(--s1)}.ch-wrap .bar.s2{fill:var(--s2)}
.ch-wrap .hit{fill:transparent;cursor:pointer;outline:none}
.ch-wrap .hit.on,.ch-wrap .hit:focus{fill:var(--ink);fill-opacity:.06}
.ch-tip{position:absolute;top:-6px;transform:translateY(-100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:12.5px;pointer-events:none;white-space:nowrap;z-index:2}
.ch-tip .th{font-size:11.5px;color:var(--mute);margin-bottom:3px}
.ch-tip .tr{display:flex;align-items:center;gap:6px}.ch-tip .tr b{font-variant-numeric:tabular-nums}.ch-tip .tr span{color:var(--ink2)}
.lk2{display:inline-block;width:12px;height:2px;border-radius:2px}
details.tv{margin-top:8px}details.tv summary{cursor:pointer;font-size:12.5px;color:var(--ink2);font-weight:600}
.tbl-wrap{overflow-x:auto;margin-top:6px}
.stbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stbl th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.stbl td span{color:var(--mute);font-size:12px}
.stat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;align-items:center;gap:8px;font-size:13px}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hb .ht{height:10px;background:var(--soft);border-radius:4px;overflow:hidden}.hb .ht i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb b{font-variant-numeric:tabular-nums;white-space:nowrap}.hb small{grid-column:2/4;font-size:11.5px;color:var(--mute);margin-top:-6px}
.segbar{display:flex;gap:2px;height:14px;margin:4px 0 12px}.segbar i{display:block;height:100%;border-radius:4px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.stat2{grid-template-columns:minmax(0,1fr)}}

.act.c4 .ai{background:#e6f1fb;color:#2a78d6}.act.c5 .ai{background:#fdf3d8;color:#a77708}.act.c6 .ai{background:#fbe7e4;color:var(--bad)}

.olist{display:grid;gap:8px}

/* 노트 */
.ndoc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.ndoc h1{font-size:24px;margin:0 0 8px;letter-spacing:-.6px}
.ndoc .ov{color:var(--ink2);font-size:15px;line-height:1.7;margin:0 0 6px}
.ndoc h3{font-size:17px;margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--acc)}
.ndoc ul.pt{margin:0;padding-left:20px;line-height:1.75;font-size:15px}
.ndoc .terms{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:4px 12px;margin-top:10px;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.ndoc .terms b{white-space:nowrap}
.ndoc .ntip{margin-top:10px;font-size:14px;background:var(--acc2);border-radius:10px;padding:9px 12px;line-height:1.55}
.ndoc .ck{display:grid;gap:6px;margin-top:8px}
.ndoc .ck label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;cursor:pointer}
.ndoc .ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--ok)}
.ndoc .foot2{margin-top:22px;font-size:11.5px;color:var(--mute);text-align:right}
/* 마인드맵 */
.mm-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mm-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto;height:min(70vh,640px);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.mm-wrap svg{display:block}
.mm-node{cursor:pointer}
.mm-node rect{stroke-width:1.5}
.mm-node text{font-family:var(--font);dominant-baseline:central}
/* 로그인 */
.oauth{display:grid;gap:8px;margin-top:4px}
.oauth button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:12px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line)}
.oauth .g{background:#fff;color:#1f1f1f;border-color:#dadce0}
.oauth .k{background:#FEE500;color:#191919;border-color:#FEE500}
.oauth svg{width:18px;height:18px}
.divider{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12.5px;margin:16px 0 4px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{border:0;background:none;color:var(--ink2);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.pwrule{font-size:12px;color:var(--mute);margin-top:6px}
.pwrule.ok{color:var(--ok)}
/* 계정 */
.coinbig{display:flex;align-items:center;gap:14px;background:var(--solid);color:var(--solid-fg);border-radius:18px;padding:18px 20px;margin:6px 0}
.coinbig span{display:block;font-size:13px;opacity:.75;font-weight:600}
.coinbig b{font-size:34px;letter-spacing:-1px}
.coinbig .rt{margin-left:auto;text-align:right;font-size:13px;line-height:1.6;opacity:.9}
.subbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:14px}
.subbox.on{border-color:var(--ok)}
.subbox b{color:var(--ok)}
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:13px}
.prices div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prices div b{float:right;color:var(--acc)}
/* 관리자 */
.prtbl{width:100%;border-collapse:collapse;font-size:13px}
.prtbl th,.prtbl td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.prtbl input{width:64px;padding:6px;text-align:center}
.prtbl th:first-child,.prtbl td:first-child{text-align:left;font-weight:700}
.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow .btn{flex:0 0 auto;white-space:nowrap}.searchrow input{min-width:0}
/* 인쇄 (요약 노트) */
@media print{
  body.printing-note>*:not(#printRoot){display:none!important}
  body.printing-note #printRoot{display:block}
  body.printing-note #printRoot .ndoc{border:0;padding:14mm;color:#111;background:#fff}
  body.printing-note #printRoot .ndoc .terms{background:#f3f3f3}
  body.printing-note #printRoot .ndoc .ntip{background:#fbeee8}
  body.printing-note{--card:#fff;--soft:#f3f3f3;--acc2:#fbeee8;--ink:#111;--ink2:#333;--mute:#666;--line:#ddd}
}
footer.site .credit b{background:none;border:0;padding:0}

.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:46px}
.pwwrap .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--mute);cursor:pointer;border-radius:8px}
.pwwrap .eye:hover{color:var(--ink)}
.tg.old{background:#fdf3d8;color:#a77708}
body.dark .tg.old{background:#33290f}

.seg button{white-space:nowrap;word-break:keep-all;flex:1 0 auto}
.smode .act{width:100%}
.solve-head{display:flex;justify-content:flex-end;margin:-4px 0 8px}

/* PDF 아래 로고 */
.page-foot{align-items:center}
.page-foot .pf-brand{display:inline-flex;align-items:center;gap:5px;color:#555}
.page-foot .pf-brand svg{width:15px;height:15px;flex:0 0 auto}
.page-foot .pf-brand b{font-weight:800;color:#1F2A44;font-size:11px}
.page-foot .pf-brand b em{font-style:normal;color:#E2683C}
.page-foot .pf-brand small{font-size:10px;color:#888}
/* 오류 신고 */
.rpt{font-size:12.5px;font-weight:700;color:var(--mute);align-self:center;padding:0 4px;white-space:nowrap}
.rpt.ok{color:var(--ok)}
.qcard .acts{flex-wrap:wrap}
.qcard .acts .rpb{color:var(--bad)}
.rprow{display:flex;justify-content:flex-end;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.rprow .rpb{color:var(--bad)}
.chips2.rpr button.on{background:var(--solid);border-color:var(--solid);color:var(--solid-fg)}
.rpc .rpb2{margin-top:10px;font-size:14px;line-height:1.6}
.rpc .rpb2 b{color:var(--bad);margin-right:4px}
.rpc .rpai{margin-top:8px;font-size:13.5px;line-height:1.55;background:var(--soft);border-radius:10px;padding:8px 10px}
.rpc .rpai span{display:block;font-size:11.5px;font-weight:800;color:var(--mute);margin-bottom:2px}
.rpq{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.rpq .rpl{font-size:11.5px;font-weight:800;color:var(--mute);margin-bottom:6px}
.rpq .ansv{margin-top:8px;background:var(--okbg);border-radius:10px;padding:8px 10px;line-height:1.6}
.rpq .ansv b{color:var(--ok)}
.rpn{margin-top:8px}.rpn summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--acc)}
.stb.rp-admin,.stb.rp-checking{background:var(--acc2);color:var(--acc)}.stb.rp-accepted{background:var(--okbg);color:var(--ok)}.stb.rp-rejected{background:var(--sel);color:var(--mute)}
.page-foot .pf-brand small{margin-left:-4px}

.sv.hold{border-color:var(--line);box-shadow:inset 4px 0 0 var(--mute)}.sv.hold .mk{color:var(--mute)}
.badge.hold{background:var(--acc2);color:var(--acc)}
.rpt.hold{color:var(--acc)}
</style>

function fmt(s) {
  const lines = String(s ?? '').split('\n');

    if (!tbl.length) return;
    out.push('<table class="tb">' + tbl.map(r => '<tr>' + r.map(c => `<td>${esc(c.trim())}</td>`).join('') + '</tr>').join('') + '</table>');
    tbl = [];
  };
  for (const ln of lines) {
    if (/\|/.test(ln) && ln.split('|').filter(x => x.trim()).length >= 2 && !/\$[^$]*\|[^$]*\$/.test(ln)) {
      const cells = ln.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
      if (cells.every(c => /^\s*:?-{2,}:?\s*$/.test(c))) continue;
      tbl.push(cells);

  }

}

const MAX_FILE_MB = 14, MAX_TOTAL_MB = 14;
async function addFiles(list, P) {
  for (const file of list) {
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name), isImg = /^image\//.test(file.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(file.name);
    if (!isPdf && !isImg) { toast(`"${file.name}"은(는) 올릴 수 없는 파일이에요`); continue; }
    const f = { id: uid(), name: file.name, kind: isPdf ? 'pdf' : 'image', status: 'loading', range: '' };
    UP.files.push(f); renderFiles(P);
    try {
      if (isPdf) {
        f.bytes = new Uint8Array(await file.arrayBuffer()); f.size = f.bytes.length; f.mime = 'application/pdf';
        f.pages = await pdfPageCount(f.bytes);
      } else Object.assign(f, await loadImage(file));

  }
}
function renderFiles(P) {
  const box = $('#files', P); if (!box) return;
  box.innerHTML = UP.files.map(f => `<div class="file" data-id="${f.id}">
      <div class="th ${f.kind === 'pdf' ? 'pdf' : ''}" style="${f.thumb ? `background-image:url(${f.thumb})` : ''}">${f.kind === 'pdf' ? 'PDF' : f.thumb ? '' : 'IMG'}</div>
      <div class="meta"><div class="nm">${esc(f.name)}</div>
        <div class="inf">${f.status === 'loading' ? '읽는 중…' : f.status === 'err' ? `<span class="err">${esc(f.err)}</span>` : `${kb(f.size)}${f.pages ? ` · ${f.pages}쪽` : ''}${f.size > MAX_FILE_MB * 1048576 && !f.range ? ' · <span class="err">커서 쪽 범위를 정해 주세요</span>' : ''}`}</div>
        ${f.kind === 'pdf' && f.status === 'ok' ? `<div class="rng">쪽 범위 <input type="text" value="${esc(f.range)}" placeholder="전체 (예: 3-12)" data-r></div>` : ''}</div>

  $$('.file', box).forEach(row => {
    const f = UP.files.find(x => x.id === row.dataset.id);

    const r = $('[data-r]', row); if (r) r.onchange = e => { f.range = e.target.value.trim(); renderFiles(P); };

async function prepareFiles(files) {

    const b = await fileBytes(f);
    if (b.bytes.length > MAX_FILE_MB * 1048576) throw new Error(`"${f.name}"가 너무 커요 (${kb(b.bytes.length)}). PDF는 쪽 범위를 정해서 ${MAX_FILE_MB}MB 아래로 줄여 주세요.`);

  for (let i = 0; i < prepared.length; i++) { setMsg && setMsg(`자료를 올리는 중… (${i + 1}/${prepared.length})`); await putFile(r.files[i], prepared[i]); }
}
async function putFile(u, { bytes, mime }) {

    if (res.ok) return;
    console.warn('보관함 업로드 실패', res.status);
  } catch (e) { console.warn('보관함 업로드 실패', e); }
  if (bytes.length > 6e6) throw new Error('자료를 서버에 올리지 못했어요. 파일이 크면 PDF 쪽 범위를 줄여서 다시 해 주세요.');

async function submitUpload(P) {

  if (UP.files.some(f => f.status === 'loading')) return toast('자료를 읽는 중이에요. 잠시만 기다려 주세요');
  showLoading('자료를 올리는 중이에요', '', false, { tip: false });
  try {

    const sum = have + prepared.reduce((a, p) => a + p.bytes.length, 0);
    if (sum > MAX_TOTAL_MB * 1048576) throw new Error(`한 학습의 자료는 합쳐서 ${MAX_TOTAL_MB}MB까지예요 (지금 ${kb(sum)}). PDF 쪽 범위를 줄이거나 다른 학습으로 나눠 주세요.`);
    let itemId = UP.item && UP.item.id;

let CUR = { item: null };
const PAR = 4; // 서버가 동시에 만드는 묶음 수 (예상 시간 계산용)
const avgTask = () => +(PUBCFG && PUBCFG.avg_task_ms) || 25000;
const avgAnalyze = () => +(PUBCFG && PUBCFG.avg_analyze_ms) || 40000;
function estSeconds(kind, n, parts) {
  if (kind === 'flash') return Math.ceil(Math.ceil(n / 10) / PAR) * avgTask() * 1.2 / 1000;
  if (['note', 'mindmap'].includes(kind)) return avgTask() * 1.4 / 1000;
  const tasks = Math.ceil(n / 5) + Math.max(0, (parts || 1) - 1);
  return Math.ceil(tasks / PAR) * avgTask() / 1000;
}
function estText(kind, n, parts) {
  const s = estSeconds(kind, n, parts);
  return `예상 시간 약 ${durText(s * 0.8)}~${durText(s * 1.5)} · ${PUBCFG && PUBCFG.avg_task_ms ? '최근 실제 기록으로 계산했어요' : '처음 몇 번은 대략적인 값이에요'}`;
}
/* 진행률: 서버 시각 기준으로 계산 (다시 들어와도 처음부터 시작하지 않아요) */
function jobProgress(j) {

  const el = now - new Date(j.created_at).getTime(), t = j.tasks || {};
  if (j.kind === 'analyze') { const a = avgAnalyze(); return { r: Math.min(0.95, el / a), el, eta: Math.max(5000, a - el) }; }
  const a = avgTask(), total = Math.max(1, j.total);

  (t.running_list || []).forEach(x => { const e = now - new Date(x.started_at).getTime(); part += (x.count || 1) * Math.min(0.9, e / a); runLeft = Math.max(runLeft, a - e); });

async function buildPdfBlob(showProgress) {

  const fontEmbedCSS = await katexFontCSS(pages);
  const doc = await PDFLib.PDFDocument.create();
  const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|Android/.test(navigator.userAgent);
  const opt = { pixelRatio: 2, backgroundColor: '#ffffff', width: 794, height: 1123, fontEmbedCSS, cacheBust: false };
  for (let i = 0; i < pages.length; i++) {
    if (showProgress) { setLoadingDetail(`${i + 1} / ${pages.length}쪽`); setProgress((i + 1) / pages.length); }
    if (i === 0 && isSafari) { try { await htmlToImage.toCanvas(pages[i], opt); } catch (e) {} }
    const canvas = await htmlToImage.toCanvas(pages[i], opt);
    const jpg = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
    const img = await doc.embedJpg(new Uint8Array(await jpg.arrayBuffer()));

  return { blob: new Blob([await doc.save()], { type: 'application/pdf' }), name, pages: pages.length };
}

/* =============== 사이트에서 풀기 · 채점 =============== */
const NORM = s => String(s || '').toLowerCase().replace(/\$/g, '').replace(/[\s.,·'"‘’“”()\[\]{}<>!?~:;]/g, '').replace(/(입니다|이다|다)$/, '');

function textEq(mine, ans) {
  const m = NORM(mine); if (!m) return false;
  return String(ans || '').split(/\s*(?:\/|또는|,\s*or\s*)\s*/).map(NORM).filter(Boolean).some(a => a === m || (a.length >= 4 && (m.includes(a) || a.includes(m)) && Math.min(a.length, m.length) / Math.max(a.length, m.length) > 0.6));
}
function keyedAnswer(ans, keys) { // "㉠ 용어, ㉡ 용어" / "ㄱ: 답, ㄴ: 답" / "1-ⓑ, 2-ⓐ"
  const out = {}; const s = String(ans || '');
  keys.forEach((k, i) => {
    const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[:.)-]?\\s*(.+?)(?=\\s*[,;]?\\s*(?:' + keys.filter((_, j) => j !== i).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\s*[:.)-]|$)');
    const m = s.match(re); if (m) out[k] = m[1].trim().replace(/[,;]$/, '');
  });
  return out;
}
const blanksOf = q => [...new Set(q.question.match(/[㉠-㉭]/g) || [])];
const itemized = q => q.type === 'short' && q.statements.length >= 2 && (q.answer.match(/(^|[\s,;/])[ㄱ-ㅇ]\s*[:.)]/g) || []).length >= 2;
function gradeQ(q, a) {
  const empty = a == null || a === '' || (Array.isArray(a) && !a.length) || (typeof a === 'object' && !Array.isArray(a) && !Object.values(a).some(v => String(v || '').trim()));
  if (['essay', 'error'].includes(q.type)) return empty ? 'wrong' : 'self';
  if (empty) return 'wrong';
  if (CHOICE_TYPES.includes(q.type)) {
    const c = nums(q.answer);
    if (q.type === 'multi') { const s = new Set(a); return c.length && c.length === s.size && c.every(x => s.has(x)) ? 'right' : c.some(x => s.has(x)) ? 'partial' : 'wrong'; }
    return c[0] === a ? 'right' : 'wrong';
  }
  if (q.type === 'ox') { const c = /^\s*[Oo○◯]/.test(q.answer) ? 'O' : /^\s*[Xx×✕]/.test(q.answer) ? 'X' : ''; return c === a ? 'right' : 'wrong'; }
  if (q.type === 'match') {
    const keys = q.statements.map((_, i) => String(i + 1)), want = {}; [...String(q.answer).matchAll(/(\d+)\s*[-–:→]\s*([ⓐ-ⓩ])/g)].forEach(m => want[m[1]] = m[2]);
    const ok = keys.filter(k => want[k] && a[k] === want[k]).length; return ok === keys.length ? 'right' : ok ? 'partial' : 'wrong';
  }
  if (q.type === 'blank') {
    const ks = blanksOf(q); if (ks.length <= 1) return textEq(typeof a === 'object' ? Object.values(a)[0] : a, String(q.answer).replace(/^[㉠-㉭]\s*/, '')) ? 'right' : 'wrong';
    const w = keyedAnswer(q.answer, ks); const ok = ks.filter(k => w[k] && textEq(a[k], w[k])).length; return ok === ks.length ? 'right' : ok ? 'partial' : 'wrong';
  }
  if (itemized(q)) {
    const ks = q.statements.map((_, i) => HANGUL[i]), w = keyedAnswer(q.answer, ks); const ok = ks.filter(k => w[k] && textEq(a[k], w[k])).length;
    return ok === ks.length ? 'right' : ok ? 'partial' : 'wrong';
  }
  if (q.type === 'calc') { const n1 = parseFloat(String(a).replace(/,/g, '')), n2 = parseFloat(String(q.answer).replace(/,/g, '').match(/-?\d+(\.\d+)?/) || 'x'); if (!isNaN(n1) && !isNaN(n2)) return Math.abs(n1 - n2) < 1e-6 ? 'right' : 'self'; return textEq(a, q.answer) ? 'right' : 'self'; }
  return textEq(a, q.answer) ? 'right' : 'wrong';
}
function mineText(q, a) {

  if (typeof a === 'object') return Object.entries(a).filter(([, v]) => String(v || '').trim()).map(([k, v]) => `${k}${q.type === 'match' ? '-' : ': '}${v}`).join(', ');

}

const BOX_DAYS = [0, 0, 1, 3, 7, 14];

async function viewFlash(id) {

  const itemTitle = (r.item && r.item.title) || '';

  const save = () => { clearTimeout(save.t); if (!r.foreign) save.t = setTimeout(() => api('outputSave', { outputId: id, progress: pg }).catch(() => {}), 1500); };
  const boxOf = c => pg.box[c.id] || 0;

      ${pageHead(`<span class="k">${esc(itemTitle)}</span><h2>${esc(r.title || '플래시카드')}</h2>`, `${cards.length}장 · 알아요/몰라요를 누르면 다음 복습 날짜가 정해져요.`, ['#/item/' + r.item_id, '학습으로'])}
      <div class="boxes">${[0, 1, 2, 3, 4, 5].map(k => `<div><b>${b[k]}</b>${k ? BOX_L[k] : '처음'}</div>`).join('')}</div>
      <div class="acts6" style="grid-template-columns:1fr;gap:8px">

    $$('[data-m]').forEach(b => b.onclick = () => start(b.dataset.m));
    const rs = $('#fcReset'); if (rs) rs.onclick = () => { if (!confirm('알아요/몰라요 기록을 모두 지울까요?')) return; pg.box = {}; pg.due = {}; save(); home(); };
  };
  const start = m => {
    mode = m; idx = 0; flipped = false; again = new Set(); sess = { k: 0, u: 0 };
    queue = m === 'due' ? cards.filter(isDue).sort((a, b) => boxOf(a) - boxOf(b)) : m === 'weak' ? cards.filter(c => boxOf(c) === 1) : cards.slice().sort(() => Math.random() - 0.5);
    show();
  };
  const show = () => {
    if (idx >= queue.length) return finish();
    const c = queue[idx];
    APP().innerHTML = `<div class="wrap" style="max-width:640px">
      ${pageHead(`<h2 style="font-size:20px">${esc(r.title || '플래시카드')}</h2>`, '', null, `<button class="btn sm" id="fcStop">그만하기</button>`)}
      <div class="fc-top"><span><b>${idx + 1}</b> / ${queue.length}</span><span>·</span><span style="color:var(--ok)">알아요 ${sess.k}</span><span style="color:var(--bad)">몰라요 ${sess.u}</span><span class="spacer"></span>${c.partTitle ? `<span class="tg">${esc(c.partTitle)}</span>` : ''}</div>
      <div class="prog" style="margin:0 0 4px"><i style="width:${idx / queue.length * 100}%"></i></div>
      <div class="fc-stage"><div class="fc ${flipped ? 'flip' : ''}" id="fc">
        <div class="face"><small>질문</small><div class="tx">${fmt(c.front)}</div><span class="hint">눌러서 뒤집기</span></div>
        <div class="face back"><small>답</small><div class="tx">${fmt(c.back)}</div></div></div></div>
      <div class="fc-btns"><button class="btn no" id="fcNo">몰라요</button><button class="btn yes" id="fcYes">알아요</button></div>
      <p class="note" style="margin-top:10px;background:none;padding:0;text-align:center">PC: 스페이스 = 뒤집기 · ← 몰라요 · → 알아요</p></div>`;
    renderMath($('#fc'));
    const fit = () => { const f = $('#fc'); if (!f) return; const h = Math.max(300, ...$$('.face', f).map(x => x.scrollHeight)); f.style.minHeight = h + 'px'; };
    fit();
    $('#fc').onclick = () => { flipped = !flipped; $('#fc').classList.toggle('flip', flipped); };
    $('#fcNo').onclick = () => answer(false);
    $('#fcYes').onclick = () => answer(true);
    $('#fcStop').onclick = () => { save(); home(); };
  };
  const answer = know => {
    const c = queue[idx];
    if (know) { pg.box[c.id] = Math.min(5, (pg.box[c.id] || 1) + 1); pg.due[c.id] = Date.now() + BOX_DAYS[pg.box[c.id]] * 86400e3; sess.k++; }
    else { pg.box[c.id] = 1; pg.due[c.id] = Date.now(); sess.u++; if (!again.has(c.id)) { again.add(c.id); queue.splice(Math.min(queue.length, idx + 4), 0, c); } }
    pg.seen = (pg.seen || 0) + 1; pg.last = Date.now(); save();
    idx++; flipped = false; show();
  };
  const finish = () => {
    save(); const b = counts();
    APP().innerHTML = `<div class="wrap" style="max-width:640px"><div class="card" style="text-align:center;padding:28px 18px">
      <div style="font-size:42px">🎉</div><h2 style="margin:8px 0">다 봤어요!</h2>
      <p class="sub">알아요 <b style="color:var(--ok)">${sess.k}</b> · 몰라요 <b style="color:var(--bad)">${sess.u}</b></p>
      <div class="boxes">${[1, 2, 3, 4, 5].map(k => `<div><b>${b[k]}</b>${BOX_L[k]}</div>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:10px">${b[1] ? '<button class="btn pri" id="fW">모르는 카드 다시</button>' : ''}<button class="btn" id="fH">처음 화면</button></div></div></div>`;
    const w = $('#fW'); if (w) w.onclick = () => start('weak');
    $('#fH').onclick = home;
  };
  document.onkeydown = e => {
    if (ROUTE[0] !== 'flash' || !$('#fc')) return;
    if (e.key === ' ') { e.preventDefault(); $('#fc').click(); } else if (e.key === 'ArrowLeft') answer(false); else if (e.key === 'ArrowRight') answer(true);
  };
  if (!cards.length) { APP().innerHTML = `<div class="wrap"><p class="note">카드가 없어요.</p></div>`; return; }
  home();
}

/* =============== 마인드맵 =============== */
const MM_COLORS = ['#e2683c', '#2a78d6', '#2f8f5b', '#8a5bd6', '#d9a21b', '#c8402f', '#1aa3a3', '#b0569a'];
async function viewMap(id) {
  APP().innerHTML = `<div class="wrap"><div class="note">불러오는 중…</div></div>`;
  let r; try { r = await api('outputGet', { outputId: id }); } catch (e) { return handleErr(e); }
  if (ROUTE[1] !== id) return;
  const data = Object.assign({}, r.data || {}); data.children = (data.children || []).slice().sort((x, y) => (x.o || 0) - (y.o || 0)); let nid = 0;
  const mk = (x, d, col) => { const n = { id: ++nid, label: sv(x.label || x.root || '·', 60), note: sv(x.note, 200), d, col, kids: [] }; n.kids = (x.children || []).map((c, i) => mk(c, d + 1, d === 0 ? MM_COLORS[i % MM_COLORS.length] : col)); return n; };
  const root = mk({ label: data.root || '주제', children: data.children || [] }, 0, '#1f2a44');
  const closed = new Set(); const walk = (n, f) => { f(n); n.kids.forEach(k => walk(k, f)); };
  walk(root, n => { if (n.d >= 2 && n.kids.length) closed.add(n.id); });
  let zoom = 1;
  APP().innerHTML = `<div class="wrap" style="max-width:1100px">${pageHead(`<span class="k">${esc((r.item && r.item.title) || '')}</span><h2>마인드맵</h2>`, '가지를 누르면 펼치고 접혀요.', ['#/item/' + r.item_id, '학습으로'])}
    <div class="mm-tools"><button class="btn sm" id="mOpen">모두 펼치기</button><button class="btn sm" id="mClose">모두 접기</button><span class="spacer"></span>
      <button class="btn sm" id="mOut">－</button><button class="btn sm" id="mIn">＋</button><button class="btn sm acc" id="mPng">이미지 저장</button></div>
    <div class="mm-wrap" id="mmw"></div></div>`;
  bindBack(APP());
  const ctx = document.createElement('canvas').getContext('2d');
  const tw = (t, d) => { ctx.font = `${d === 0 ? 800 : d === 1 ? 700 : 500} ${d === 0 ? 17 : d === 1 ? 15 : 13.5}px Pretendard, sans-serif`; return Math.ceil(ctx.measureText(t).width); };
  const css = () => { const s = getComputedStyle(document.body); return { card: s.getPropertyValue('--card').trim() || '#fff', ink: s.getPropertyValue('--ink').trim() || '#1f2a44', line: s.getPropertyValue('--line2').trim() || '#ccc', bg: s.getPropertyValue('--card').trim() || '#fff' }; };
  const draw = () => {
    const C = css(), GAP = 14, ROW = 40, pos = [];
    const colW = []; walk(root, n => { const w = tw(n.label, n.d) + 30; colW[n.d] = Math.max(colW[n.d] || 0, Math.min(w, 260)); });
    const colX = [20]; for (let i = 1; i < colW.length; i++) colX[i] = colX[i - 1] + colW[i - 1] + 50;
    let y = 20;
    const place = n => {
      const vis = closed.has(n.id) ? [] : n.kids;
      if (!vis.length) { n.y = y; y += ROW; }
      else { vis.forEach(place); n.y = (vis[0].y + vis[vis.length - 1].y) / 2; }
      n.x = colX[n.d]; n.w = Math.min(tw(n.label, n.d) + 30, 260); n.h = n.d === 0 ? 44 : n.d === 1 ? 36 : 30; pos.push(n);
    };
    place(root);
    const W = Math.max(...pos.map(n => n.x + n.w)) + 30, H = y + 10;
    let edges = '', nodes = '';
    pos.forEach(n => {
      if (!closed.has(n.id)) n.kids.forEach(k => { const x1 = n.x + n.w, y1 = n.y, x2 = k.x, y2 = k.y, mx = (x1 + x2) / 2; edges += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${k.col}" stroke-opacity=".55" stroke-width="${n.d === 0 ? 3 : 2}"/>`; });
      const fill = n.d === 0 ? '#1f2a44' : n.d === 1 ? n.col : C.card, txt = n.d <= 1 ? '#fff' : C.ink, stroke = n.d <= 1 ? 'none' : n.col;
      const lab = n.label.length > 22 && n.w >= 260 ? n.label.slice(0, 20) + '…' : n.label;
      nodes += `<g class="mm-node" data-id="${n.id}" transform="translate(${n.x},${n.y - n.h / 2})">${n.note || lab !== n.label ? `<title>${esc(n.label)}${n.note ? '\n' + esc(n.note) : ''}</title>` : ''}
        <rect width="${n.w}" height="${n.h}" rx="${n.h / 2}" fill="${fill}" stroke="${stroke}"/>
        <text x="${n.w / 2}" y="${n.h / 2}" text-anchor="middle" fill="${txt}" font-size="${n.d === 0 ? 17 : n.d === 1 ? 15 : 13.5}" font-weight="${n.d === 0 ? 800 : n.d === 1 ? 700 : 500}">${esc(lab)}</text>
        ${n.kids.length && closed.has(n.id) ? `<g transform="translate(${n.w + 4},${n.h / 2 - 10})"><rect width="${String(n.kids.length).length * 8 + 16}" height="20" rx="10" fill="${n.col}"/><text x="${(String(n.kids.length).length * 8 + 16) / 2}" y="10" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="800">+${n.kids.length}</text></g>` : ''}</g>`;
    });
    $('#mmw').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * zoom}" height="${H * zoom}" viewBox="0 0 ${W} ${H}" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect width="${W}" height="${H}" fill="${C.bg}"/>${edges}${nodes}</svg>`;
    $$('#mmw .mm-node').forEach(g => g.onclick = () => { const n = pos.find(x => x.id === +g.dataset.id); if (!n || !n.kids.length) return; closed.has(n.id) ? closed.delete(n.id) : closed.add(n.id); draw(); });
  };
  draw();
  $('#mOpen').onclick = () => { closed.clear(); draw(); };
  $('#mClose').onclick = () => { walk(root, n => { if (n.d >= 1 && n.kids.length) closed.add(n.id); }); draw(); };
  $('#mIn').onclick = () => { zoom = Math.min(2.5, zoom * 1.2); draw(); };
  $('#mOut').onclick = () => { zoom = Math.max(0.4, zoom / 1.2); draw(); };
  $('#mPng').onclick = async () => {

const STAT = { days: 30, data: null };

function drawStats() {

    <div class="statbar"><div class="seg" id="stDays">${[7, 30, 90].map(n => `<button data-d="${n}" class="${STAT.days === n ? 'on' : ''}">${n}일</button>`).join('')}</div><span class="note" style="background:none;padding:0">기준: 한국 시간 · ${d.today}까지</span></div>

    <div class="tiles">${tile('전체 회원', nfmt(k.users_total) + '명', `${P} +${nfmt(k.users_new)} · 오늘 +${nfmt(k.users_today)}`)}${tile('활성 회원', nfmt(k.users_active) + '명', P + ' 접속')}${tile('정액제', nfmt(k.subs_active) + '명', '지금 이용 중')}${tile('확인 대기', nfmt(k.users_pending) + '명', '', k.users_pending > 0)}</div>
    <div class="sgrp">사용</div>
    <div class="tiles">${tile(P + ' 만든 문제', nfmt(k.questions_period) + '개', `오늘 ${nfmt(k.questions_today)} · 누적 ${nfmt(k.questions_total)}`)}${tile(P + ' 학습', nfmt(k.items_period) + '개', `전체 ${nfmt(k.items_total)}개`)}${tile(P + ' 풀기', nfmt(k.attempts_period) + '번', `PDF 저장 ${nfmt(k.exports_period)}번`)}${tile(P + ' 서버 요청', nfmt(k.requests_period) + '회', `실패 ${nfmt(k.requests_failed)}회 (${fail}%) · 묶음 평균 ${(k.avg_task_ms / 1000).toFixed(1)}초`, fail >= 10)}</div>
    <div class="sgrp">코인</div>
    <div class="tiles">${tile(P + ' 쓴 코인', nfmt(k.coins_used_period), '반환 뺀 값')}${tile(P + ' 지급한 코인', nfmt(k.coins_given_period), '관리자 지급 + 체험')}${tile('남은 코인 합계', nfmt(k.coins_outstanding), '회원들이 아직 안 쓴 코인')}</div>

    ${chartCard('일별 쓴 코인', d.daily, [{ key: 'coins', name: '코인', c: 's1' }], v => nfmt(v), 'd')}
    ${chartCard('일별 신규 가입', d.daily, [{ key: 'signups', name: '가입', c: 's1' }], v => nfmt(v) + '명', 'd')}

  $$('#stDays button', box).forEach(b => b.onclick = () => { STAT.days = +b.dataset.d; adminStats(); });

async function boot() {
  const wasRecovery = /type=recovery/.test(location.hash);
  APP().innerHTML = `<div style="text-align:center;padding:80px 0"><div class="spin"></div></div>`;
  renderNav();
  if (!CONFIGURED) return route();
  await loadPublicConfig();
  if (FAKE) { if (!FAKE.out) await syncMe(FAKE.name); }
  else {
    const c = authClient();
    if (!c) { APP().innerHTML = `<div class="wrap"><p class="err">로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해 주세요.</p></div>`; return; }
    const errHash = /error_description=([^&]+)/.exec(location.hash);
    c.auth.onAuthStateChange((ev, session) => {
      setTimeout(async () => {
        if (ev === 'PASSWORD_RECOVERY') { history.replaceState(null, '', siteUrl() + '#/reset'); return route(); }
        if (ev === 'SIGNED_IN' && session && (!ME || ME.id !== session.user.id)) { await syncMe(); if (/access_token=/.test(location.hash) || !location.hash) history.replaceState(null, '', siteUrl() + '#/'); route(); resumeWatch(); }
        if (ev === 'SIGNED_OUT' && ME) { ME = null; renderNav(); route(); }
      }, 0);
    });
    const { data } = await c.auth.getSession();
    if (data && data.session && !ME) await syncMe();
    if (wasRecovery) history.replaceState(null, '', siteUrl() + '#/reset');
    else if (/access_token=/.test(location.hash)) history.replaceState(null, '', siteUrl() + '#/');
    if (errHash) { history.replaceState(null, '', siteUrl() + '#/'); setTimeout(() => toast(authMsg(decodeURIComponent(errHash[1].replace(/\+/g, ' '))), 5000), 300); }
  }
  route(); resumeWatch();
  try { const w = document.createElement('span'); w.style.cssText = 'position:fixed;left:-9999px'; w.textContent = '$x^2$'; document.body.append(w); renderMath(w); setTimeout(() => w.remove(), 3000); } catch (e) {}
}
window.addEventListener('DOMContentLoaded', boot);
