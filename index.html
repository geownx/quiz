<title>문제지 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root{
  --ink:#1f2a44; --ink2:#46506a; --mute:#7a8296; --line:#e3e1db; --bg:var(--soft); --card:#fff;
  --acc:#e2683c; --acc2:#fbe9e1; --ok:#2f8f5b; --bad:#c8402f;
  --r:14px; --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.topbar{position:sticky;top:0;z-index:20;background:var(--solid);color:var(--solid-fg);display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--acc);font-style:normal;font-size:14px}
.tbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:13.5px;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.stepper{display:flex;gap:4px;margin:2px 0 20px}
.stepper button{flex:1;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--mute);font-size:11.5px;font-weight:600}
.stepper button:disabled{cursor:default}
.stepper .bar{height:4px;border-radius:4px;background:var(--line);margin-bottom:6px}
.stepper .on{color:var(--ink)} .stepper .on .bar{background:var(--acc)}
.stepper .done .bar{background:var(--ink)}
h2{font-size:22px;letter-spacing:-.5px;margin:0 0 6px;line-height:1.35}
.sub{color:var(--ink2);margin:0 0 18px;font-size:14.5px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-t{font-weight:700;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t small{font-weight:500;color:var(--mute);font-size:12.5px}
label.lb{display:block;font-weight:600;font-size:13.5px;margin:12px 0 6px;color:var(--ink2)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:44px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 16px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
a.btn{color:var(--ink);text-decoration:none}
.btn.pri{background:var(--solid);color:var(--solid-fg);border-color:var(--solid)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--glass);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.navbar .btn{flex:1}
.navbar .btn.back{flex:0 0 auto}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--acc);background:var(--acc2)}
.drop .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop p{color:var(--mute);font-size:13px;margin:12px 0 0}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.file .th{width:54px;height:54px;border-radius:8px;background:var(--soft) center/cover;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
.file .th.pdf{background:#c8402f}
.file .meta{flex:1;min-width:0}
.file .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .inf{font-size:12.5px;color:var(--mute);margin-top:2px}
.file .rng{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.file .rng input{padding:5px 8px;font-size:13px;width:140px}
.xbtn{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--ink2);flex:0 0 auto}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;position:relative}
.chip b{display:block;font-size:14.5px}
.chip span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.chip.on{border-color:var(--ink);background:var(--sel)}
.chip.on::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:800;color:var(--ink)}
.seg{display:flex;background:var(--soft2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;min-width:64px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.num{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.num button{border:0;background:var(--soft);width:34px;height:36px;font-size:18px;cursor:pointer;color:var(--ink)}
.num input{border:0;width:52px;text-align:center;padding:6px 2px;border-radius:0;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.part{position:relative}
.part .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.part .tag{background:var(--solid);color:var(--solid-fg);font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 7px;letter-spacing:.3px}
.part .src{font-size:12px;color:var(--mute)}
.part input.ti{font-weight:700;font-size:16px}
.part textarea,.part input.cc{margin-top:6px;font-size:14px}
.part .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.ib{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--ink2);font-size:13px}
.ib:hover{background:var(--soft2)}
.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.55}
.warn{font-size:13.5px;color:#7a3a14;background:#fdf0e3;border:1px solid #f3d6bb;border-radius:10px;padding:10px 12px;line-height:1.55;margin-bottom:12px}
.err{color:var(--bad);font-size:13.5px}
.totalbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--solid);color:var(--solid-fg);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.totalbox .num{border-color:transparent}
.totalbox .num input,.totalbox .btn{color:var(--ink)}
.totalbox b{font-size:15px}
.typecnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.typecnt .it{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
/* question cards */
.qpart{font-weight:800;font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.qpart .tag{background:var(--acc);color:#fff;font-size:11.5px;border-radius:6px;padding:3px 7px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:10px}
.qcard .qmeta{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--sel);color:var(--ink)}
.badge.d{background:var(--soft);color:var(--ink2)}
.qcard .acts{display:flex;gap:6px;justify-content:flex-end;border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.qcard .ansv{margin-top:10px;background:var(--okbg);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.qcard .ansv b{color:var(--ok)}
.failbox{background:var(--card);border:1px solid #f0c9c2;border-radius:var(--r);padding:12px 14px;margin:10px 0}
/* modal & loading */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,24,36,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin:0 0 4px;font-size:19px}
.modal ol{padding-left:20px;line-height:1.75;font-size:14px;margin:8px 0}
.loading{position:fixed;inset:0;z-index:60;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:24px}
.loading .lb2{max-width:380px;width:100%;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:sp 0.9s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading .t{font-weight:700;font-size:17px}
.loading .d{color:var(--ink2);font-size:14px;margin-top:8px;min-height:20px;line-height:1.5}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--solid);color:var(--solid-fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hist{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hist .m{flex:1;min-width:0;cursor:pointer}
.hist .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .m span{font-size:12.5px;color:var(--mute)}
.pv-list{display:grid;gap:14px;justify-items:center;margin-top:16px}
.pv{box-shadow:0 2px 12px rgba(0,0,0,.12);background:#FFFFFF;overflow:hidden;position:relative}
.pv>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.dlrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlrow .btn.full{grid-column:1/-1}

/* ===== shared question rendering (preview + PDF) ===== */
.qx{line-height:1.62}
.qx .stem{word-break:keep-all;overflow-wrap:anywhere}
.qx .stem .n{font-weight:800;margin-right:4px}
.qx .passage{border:1px solid #444;padding:8px 11px;margin:7px 0;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.qx .bogi{border:1px solid #444;padding:14px 11px 8px;margin:12px 0 7px;position:relative}
.qx .bogi::before{content:"<보 기>";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-size:.88em;font-weight:700}
.qx .bogi.plain{padding-top:8px;margin-top:7px}
.qx .bogi.plain::before{display:none}
.qx .bogi div{padding-left:1.7em;text-indent:-1.7em;word-break:keep-all;overflow-wrap:anywhere}
.qx .match{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:7px 0;border:1px solid #444;padding:8px 11px}
.qx .match div{word-break:keep-all;overflow-wrap:anywhere}
.qx .choices{display:grid;gap:3px 12px;margin-top:6px}
.qx .choices.c2{grid-template-columns:1fr 1fr}
.qx .choices.c3{grid-template-columns:1fr 1fr 1fr}
.qx .choices.c5{grid-template-columns:repeat(5,1fr)}
.qx .choices div{padding-left:1.35em;text-indent:-1.35em;word-break:keep-all;overflow-wrap:anywhere}
.qx .oxbox{display:inline-block;margin-left:6px;font-weight:700;white-space:nowrap}
.qx .aline{border-bottom:1px solid #999;height:26px;margin-top:6px}
.qx .aline.lbl{border:0;height:auto;margin-top:8px;display:flex;gap:6px;align-items:flex-end}
.qx .aline.lbl span{white-space:nowrap;font-weight:600}
.qx .aline.lbl i{flex:1;border-bottom:1px solid #999;height:22px}
.qx .abox{border:1px solid #999;margin-top:7px}
.qx table.tb{border-collapse:collapse;margin:4px 0;font-size:.95em}
.qx table.tb td{border:1px solid #666;padding:3px 8px}

/* ===== A4 page (PDF) ===== */
#pageRender{position:fixed;left:-12000px;top:0;width:800px}
#printRoot{display:none}
.page{width:794px;height:1123px;background:#fff;color:#111;padding:50px 46px 54px;display:flex;flex-direction:column;position:relative;font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR","Nanum Gothic",sans-serif;font-size:13.4px;overflow:hidden}
.sheet-head{border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:18px;position:relative}
.sheet-head::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid #111}
.sh-top{display:flex;justify-content:space-between;font-size:12px;color:#444;font-weight:600}
.sh-title{font-size:25px;font-weight:800;text-align:center;margin:8px 0 10px;letter-spacing:-.5px;word-break:keep-all}
.sh-info{display:flex;justify-content:flex-end;gap:22px;font-size:12.5px;font-weight:600}
.sh-info span i{display:inline-block;width:86px;border-bottom:1px solid #111;margin-left:6px}
.sh-info span i.s{width:44px}
.cols{flex:1;min-height:0;display:flex;gap:30px}
.col{flex:1;min-width:0;overflow:hidden;position:relative}
.cols.two .col+.col{border-left:1px solid #bbb;padding-left:15px;margin-left:-15px}
.page .q{margin-bottom:24px}
.page.one{font-size:15px}
.page.one .q{margin-bottom:28px}
.page .part-head{font-weight:800;font-size:13.5px;background:#f0f0f0;border-left:5px solid #111;padding:6px 10px;margin:2px 0 14px}
.page .part-head small{font-weight:600;color:#555;margin-left:6px}
.page-foot{position:absolute;bottom:22px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:10.5px;color:#666;border-top:1px solid #ddd;padding-top:6px}
.page .ans-grid{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12.5px;table-layout:fixed}
.page .ans-grid td{border:1px solid #888;text-align:center;padding:4px 2px;word-break:break-all}
.page .ans-grid tr:first-child td{background:#f0f0f0;font-weight:700}
.page .ans-item{margin-bottom:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.page .ans-item .h{font-weight:800}
.page .ans-item .h em{font-style:normal;color:#b23a1e;margin-left:6px}
.page .ans-item .c{font-size:11.5px;color:#666;margin-left:6px;font-weight:600}
.page .ans-item .ex{margin-top:2px}
.page .ans-item .la{margin:3px 0 4px;padding:5px 9px;background:#f4f4f4;border-left:3px solid #b23a1e}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  #printRoot .page{page-break-after:always;break-after:page}
}

/* ===== 홈페이지 레이아웃 ===== */
body{background:var(--bg)}
header.site{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(0,0,0,.06);padding-top:env(safe-area-inset-top)}
header.site .in,footer.site .in{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
header.site .in{height:62px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.6px;flex:1;min-width:0}
.logo svg{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(226,104,60,.25))}
.logo b{color:var(--acc);font-weight:800}
.logo.sm{font-size:15px;flex:0 0 auto}.logo.sm svg{width:26px;height:26px;filter:none}
header.site nav{display:flex;align-items:center;gap:4px}
.nl{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
.nl:hover{background:rgba(31,42,68,.06);color:var(--ink)}
.nl.set{border:1px solid var(--line);background:var(--card)}
.nl .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--acc);display:none;box-shadow:0 0 0 2px var(--card)}
.nl .dot.on{display:block}
footer.site{border-top:1px solid var(--line);margin-top:30px;padding:26px 0 calc(110px + env(safe-area-inset-bottom))}
footer.site .in{flex-wrap:wrap;gap:8px 18px}
footer.site p{margin:0;color:var(--mute);font-size:12.5px;flex:1;min-width:240px;line-height:1.6}
body.on-home footer.site{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@media(max-width:520px){.hide-s{display:none}.nl{padding:8px 10px}}

/* hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 340px at 85% 10%,rgba(226,104,60,.16),transparent 70%),radial-gradient(500px 300px at 0% 100%,rgba(31,42,68,.07),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,42,68,.09) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:44px 20px 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.eyebrow i{width:18px;height:18px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;color:var(--acc);font-style:normal;font-size:11px}
.hero h1{font-size:46px;line-height:1.22;letter-spacing:-1.8px;margin:18px 0 16px;font-weight:800;word-break:keep-all}
.hero h1 em{font-style:normal;color:var(--acc);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:4px;height:12px;background:var(--acc2);z-index:-1;border-radius:3px}
.hero .lead{font-size:17px;line-height:1.7;color:var(--ink2);margin:0 0 26px;max-width:470px;word-break:keep-all}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div b{display:block;font-size:24px;letter-spacing:-.6px;color:var(--ink)}
.stats div span{font-size:13px;color:var(--mute);font-weight:600}
.mini-sheet{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
.mini-sheet span{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px}

/* upload panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 50px -24px rgba(31,42,68,.28),0 2px 6px rgba(31,42,68,.05);padding:22px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h .n{width:28px;height:28px;border-radius:9px;background:var(--solid);color:var(--solid-fg);display:grid;place-items:center;font-weight:800;font-size:14px}
.panel-h b{font-size:17px;letter-spacing:-.3px}
.panel-h small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}
.panel .drop{border-radius:14px;padding:26px 14px;background:var(--soft)}
.drop .ic{width:46px;height:46px;border-radius:14px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;margin:0 auto 12px}
.drop .big{font-weight:700;font-size:15px;margin-bottom:14px}
.panel .go{width:100%;margin-top:14px;padding:14px;font-size:16px;border-radius:13px}
.keycta{display:flex;gap:12px;align-items:center;background:var(--solid);color:var(--solid-fg);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.keycta div{flex:1;font-size:13.5px;line-height:1.5}
.keycta b{display:block;font-size:14.5px}
.keycta .btn{background:var(--acc);border-color:var(--acc);color:#fff;white-space:nowrap}

/* sections */
.sec{max-width:1120px;margin:0 auto;padding:46px 20px 10px}
.sec-head{margin-bottom:22px}
.sec-head .k{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.4px}
.sec-head h3{font-size:28px;letter-spacing:-1px;margin:6px 0 0;line-height:1.3;word-break:keep-all}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step4{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
.step4 .no{font-size:12px;font-weight:800;color:var(--mute)}
.step4 .si{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin:12px 0 14px;background:var(--sel);color:var(--ink)}
.step4:nth-child(2) .si{background:var(--acc2);color:var(--acc)}
.step4:nth-child(4) .si{background:var(--okbg);color:var(--ok)}
.step4 b{display:block;font-size:16.5px;letter-spacing:-.3px;margin-bottom:6px}
.step4 p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2);word-break:keep-all}
.typecloud{display:flex;flex-wrap:wrap;gap:8px}
.typecloud span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.typecloud span:nth-child(3n+1){border-color:#f0c5b3;background:var(--acc2)}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.rc:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(31,42,68,.35)}
.rc .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .m{font-size:12.5px;color:var(--mute);margin-top:6px}
.rc .bar{height:4px;border-radius:4px;background:var(--acc);width:36px;margin-bottom:12px}
.free{display:flex;align-items:center;gap:18px;background:var(--solid);color:var(--solid-fg);border-radius:22px;padding:26px 28px}
.free h4{margin:0 0 6px;font-size:21px;letter-spacing:-.5px}
.free p{margin:0;color:var(--card);font-size:14.5px;line-height:1.6;word-break:keep-all}
.free .btn{margin-left:auto;background:var(--card);color:var(--ink);border-color:#fff;white-space:nowrap}
@media(max-width:900px){
  .hero .in{grid-template-columns:1fr;gap:26px;padding:26px 16px 24px}
  .hero h1{font-size:33px;letter-spacing:-1.2px;margin:14px 0 10px}
  .hero .lead{font-size:15.5px;margin-bottom:18px}
  .stats{gap:20px}.stats div b{font-size:20px}
  .mini-sheet{display:none}
  .steps4{grid-template-columns:1fr 1fr}
  .recent{grid-template-columns:1fr}
  .sec{padding:34px 16px 6px}
  .sec-head h3{font-size:23px}
  .free{flex-direction:column;align-items:flex-start;padding:22px}

async function addFiles(list) {
  for (const f of list) {
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const isImg = (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(f.name);
    if (!isPdf && !isImg) { toast(`${f.name}: 사진이나 PDF만 올릴 수 있어요`); continue; }
    const item = { id: uid(), name: f.name || '사진', kind: isPdf ? 'pdf' : 'image', size: f.size, status: 'loading' };
    S.files.push(item); renderFiles();
    try {
      if (isImg) Object.assign(item, await loadImage(f));
      else {
        item.bytes = new Uint8Array(await f.arrayBuffer());
        item.pages = await pdfPageCount(item.bytes);
      }
      item.status = 'ok';
    } catch (e) { item.status = 'err'; item.err = e.message || '파일을 읽지 못했어요'; }
    renderFiles();
  }
}
/* 사진은 긴 변 1800px JPEG로 줄여서 보냄 (용량·속도 절약) */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        const M = 1800, sc = Math.min(1, M / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', 0.82);
        const t = document.createElement('canvas'), ts = 120 / Math.max(c.width, c.height);
        t.width = c.width * ts; t.height = c.height * ts; t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
        URL.revokeObjectURL(url);
        resolve({ mime: 'image/jpeg', b64: dataUrl.split(',')[1], size: Math.round(dataUrl.length * 0.75), thumb: t.toDataURL('image/jpeg', 0.7) });
      } catch (e) { reject(e); }
    };
    img.onerror = async () => {
      URL.revokeObjectURL(url);
      // 브라우저가 못 여는 형식(예: 일부 HEIC)은 원본 그대로 보냄
      try {
        const b64 = await blobToB64(file);
        const mime = file.type || (/heif$/i.test(file.name) ? 'image/heif' : 'image/heic');
        resolve({ mime, b64, size: file.size, thumb: '' });
      } catch (e) { reject(new Error('사진을 열 수 없어요')); }
    };
    img.src = url;
  });
}
function blobToB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
async function pdfPageCount(bytes) {
  try { const d = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true }); return d.getPageCount(); } catch (e) { return null; }
}
function parseRange(str, max) {
  const set = new Set();
  for (const part of String(str).split(/[,，\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:\s*[-~]\s*(\d+))?$/);
    if (!m) throw new Error(`쪽 범위 "${part}"를 이해하지 못했어요 (예: 3-12, 15)`);
    let a = +m[1], b = m[2] ? +m[2] : a; if (a > b) [a, b] = [b, a];
    for (let i = a; i <= b; i++) if (i >= 1 && (!max || i <= max)) set.add(i - 1);
  }
  if (!set.size) throw new Error('쪽 범위가 비어 있어요');
  return [...set].sort((x, y) => x - y);
}
/* 자료 준비: 한 번만 구글에 올려두고(Files API) 이후 요청은 주소만 보냄 → 요청이 작아서 끊길 일이 적음.

async function fileBytes(f) {
  if (f.kind === 'image') return { bytes: b64ToBytes(f.b64), mime: f.mime };
  let bytes = f.bytes;
  if (f.range && f.range.trim()) {
    const idx = parseRange(f.range, f.pages);
    const src = await PDFLib.PDFDocument.load(f.bytes, { ignoreEncryption: true });
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, idx)).forEach(p => out.addPage(p));

}

const NET_MSG = () => IN_FRAME ? '미리보기 화면에서는 서버 연결이 막혀 있어요. 사이트 주소를 Safari·Chrome에서 열어 주세요.' : '서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.';
function apiErr(code, msg, status) {
  const fatal = ['QM_AUTH', 'QM_NOT_APPROVED', 'QM_BLOCKED', 'QM_LIMIT', 'QM_CONFIG', 'QM_FORBIDDEN', 'QM_FILE'].includes(code);
  const e = fatal ? new FatalError(msg) : new Error(msg);
  e.code = code; e.status = status;
  if (code === 'QM_AUTH' || code === 'QM_BLOCKED') setSession('', null);
  return e;
}
async function api(action, data = {}, opt = {}) {
  if (!CONFIGURED) throw new FatalError('서버 설정이 아직 안 됐어요.');
  let res;
  try { res = await fetch(FN_URL, { method: 'POST', headers: apiHeaders(), body: JSON.stringify({ action, ...data }), signal: opt.signal }); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new Error(NET_MSG()); }
  let j = null; try { j = await res.json(); } catch (e) {}
  if (!res.ok || (j && j.error)) {
    const err = (j && j.error) || {};
    throw apiErr(err.code || 'HTTP', err.message || `서버 오류 (${res.status})`, res.status);
  }
  return j;
}

async function ensureSheet() {

async function uploadMaterials(signal) {
  await ensureSheet();

  if (todo.length) {
    setLoadingDetail('자료를 서버에 올리는 중…');

    const r = await api('uploadUrls', { sheetId: S.sheetId, files: todo.map((f, i) => ({ name: f.name, mime: prepared[i].mime, size: prepared[i].bytes.length })) }, { signal });
    for (let i = 0; i < todo.length; i++) {

    }

  }

async function putFile(u, { bytes, mime }, signal) {
  try {
    const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', new Blob([bytes], { type: mime }));
    const res = await fetch(u.signedUrl, { method: 'PUT', body: fd, headers: { 'x-upsert': 'true', apikey: CONFIG.SUPABASE_KEY }, signal });
    if (res.ok) return;
    console.warn('보관함 업로드 실패', res.status, await res.text().catch(() => ''));
  } catch (e) { if (e.name === 'AbortError') throw e; console.warn('보관함 업로드 실패', e); }
  if (bytes.length > 6e6) throw new Error('자료를 서버에 올리지 못했어요. 파일이 크면 PDF 쪽 범위를 줄여서 다시 해주세요.');
  await api('uploadDirect', { path: u.path, mime, b64: await blobToB64(new Blob([bytes])) }, { signal });
}

/* =============== AI 생성 (서버 경유) =============== */
async function serverGen(kind, prompt, schema, temperature, opt = {}) {
  if (S.files.some(f => f.status === 'ok' && !f.matId)) await uploadMaterials(opt.signal);
  else await ensureSheet();
  const body = JSON.stringify({ action: 'gen', sheetId: S.sheetId, materialIds: S.materialIds, kind, prompt, schema, temperature });
  for (let attempt = 1; attempt <= 5; attempt++) {
    let res, t0 = Date.now();
    try {
      res = await fetch(FN_URL, { method: 'POST', headers: apiHeaders(), body, signal: opt.signal });
      if (res.ok) {
        const out = await readSSE(res, opt);
        if (!out.text) {
          if (out.block) throw new Error(`AI가 이 자료를 처리하지 않았어요 (${out.block}).`);
          if (attempt < 3) continue;
          throw new Error('AI 응답이 비어 있어요. 다시 시도해주세요.');
        }
        try { return parseJSON(out.text); }
        catch (e) {
          if (out.finish === 'MAX_TOKENS') throw new Error('AI 응답이 너무 길어서 잘렸어요. 문항 수를 줄여서 다시 해주세요.');
          if (out.finish === 'SAFETY' || out.finish === 'RECITATION') throw new Error(`AI가 응답을 중단했어요 (${out.finish}). 다시 시도해주세요.`);
          if (attempt < 3) continue;
          throw new Error('AI 응답을 읽지 못했어요. 다시 시도해주세요.');
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (!(e instanceof TypeError) && !e.netDrop) throw e;
      const secs = Math.round((Date.now() - t0) / 1000);
      console.warn('네트워크 오류', e, { attempt, secs });
      if (attempt < 3) { await waitWithMsg(3 * attempt, opt, '연결이 끊겨서 다시 시도'); continue; }
      throw await netError(e, secs);
    }
    let j = {}; try { j = await res.json(); } catch (e) {}
    const err = j.error || {};
    if (err.code && /^QM_/.test(err.code)) throw apiErr(err.code, err.message, res.status);
    const msg = err.message || '', det = JSON.stringify(err.details || []);
    if (res.status === 429) {
      if (/PerDay/i.test(det) || /per day/i.test(msg)) throw new FatalError('오늘 AI 무료 사용량을 다 썼어요. 내일 다시 해주세요. (관리자 키 기준)');
      const rd = (err.details || []).find(d => /RetryInfo/.test(d['@type'] || ''));
      const wait = Math.min(70, Math.ceil(rd ? parseFloat(rd.retryDelay) || 0 : 0) || 12 * attempt) + 1;
      if (attempt < 5) { await waitWithMsg(wait, opt, '사용자가 많아서 잠시 기다렸다가 계속'); continue; }
      throw new Error('요청이 너무 많아요. 1~2분 뒤 다시 시도해주세요.');
    }
    if (res.status === 400 && /too large|exceeds|payload/i.test(msg)) throw new FatalError('자료 용량이 너무 커요. PDF 쪽 범위를 줄이거나 사진 수를 줄여주세요.');
    if (res.status >= 500 && attempt < 4) { await waitWithMsg(5 * attempt, opt, 'AI 서버가 바빠서 잠시 후 다시 시도'); continue; }
    throw new Error(`AI 오류 (${res.status}): ${msg.slice(0, 200) || '알 수 없는 오류'}`);
  }
}
/* 스트리밍 응답 읽기 (글자가 조금씩 도착해서 연결이 오래 조용히 있지 않음) */
async function readSSE(res, opt) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', finish = '', block = '';
  const handle = line => {
    if (!line.startsWith('data:')) return;
    const js = line.slice(5).trim(); if (!js || js === '[DONE]') return;
    let d; try { d = JSON.parse(js); } catch (e) { return; }
    if (d.error) throw Object.assign(new Error(`AI 오류: ${(d.error.message || '').slice(0, 200)}`), {});
    if (d.promptFeedback && d.promptFeedback.blockReason) block = d.promptFeedback.blockReason;
    const c = d.candidates && d.candidates[0]; if (!c) return;
    if (c.finishReason) finish = c.finishReason;
    for (const p of (c.content && c.content.parts) || []) if (p.text && !p.thought) text += p.text;
  };
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k; while ((k = buf.indexOf('\n')) >= 0) { handle(buf.slice(0, k).replace(/\r$/, '')); buf = buf.slice(k + 1); }
      if (text) setLoadingDetail(`${opt.detail ? opt.detail + ' · ' : ''}작성 중… ${text.length.toLocaleString()}자`);
    }
    handle(buf.trim());
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    if (e instanceof TypeError || /network|terminated|aborted|load failed/i.test(e.message)) throw Object.assign(new Error('stream: ' + e.message), { netDrop: true });
    throw e;
  }
  return { text, finish, block };
}
/* 연결 실패 원인 진단: 작은 요청은 되는지 확인 */
async function netError(e, secs) {
  const mk = (C, m) => Object.assign(new C(m), { html: true });
  let small = false;
  try { small = (await fetch(FN_URL, { method: 'GET' })).status < 500; } catch (x) {}
  const tech = `(기술 정보: ${esc(e.message || e.name)} · ${secs}초)`;
  if (!navigator.onLine) return mk(FatalError, '인터넷이 연결되어 있지 않아요. 와이파이나 데이터를 확인해주세요.');
  if (!small) return mk(FatalError, `서버에 접속할 수 없어요. ${IN_FRAME ? '미리보기 화면이라면 사이트 주소를 Safari·Chrome에서 열어 주세요.' : '다른 네트워크(데이터)로 해보세요.'}<br><small>${tech}</small>`);
  if (document.hidden || secs > 50) return mk(Error, `AI가 답을 만드는 동안 연결이 끊겼어요. 화면을 켜 둔 채 이 화면에 머물러 주시고, 그래도 안 되면 문항 수나 자료 양을 줄여보세요.<br><small>${tech}</small>`);
  const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
  return mk(Error, `연결이 중간에 끊겼어요. 잠시 뒤 다시 해보세요.${inApp ? '<br><b>카카오톡·네이버 같은 앱 안에서 열었다면 Chrome이나 Safari로 열어주세요.</b>' : ''}<br><small>${tech}</small>`);
}
async function waitWithMsg(sec, opt, why) {
  for (let s = Math.ceil(sec); s > 0; s--) {
    if (opt.signal && opt.signal.aborted) throw new DOMException('aborted', 'AbortError');
    setLoadingDetail(`${why}해요… ${s}초`);
    await sleep(1000);
  }
  setLoadingDetail(opt.detail || '');
}
function parseJSON(t) {
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch (e) {}
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('JSON 아님');
}

function distribute(total) {
  const ps = S.parts; if (!ps.length) return;
  total = Math.max(0, Math.round(total));
  const W = ps.reduce((a, p) => a + p.weight, 0);
  const raw = ps.map(p => total * p.weight / W);
  ps.forEach((p, i) => p.count = Math.floor(raw[i]));
  let left = total - ps.reduce((a, p) => a + p.count, 0);
  ps.map((p, i) => [i, raw[i] - Math.floor(raw[i])]).sort((a, b) => b[1] - a[1]).forEach(([i]) => { if (left > 0) { ps[i].count++; left--; } });
  if (total >= ps.length) {
    for (const p of ps) if (p.count === 0) { const mx = ps.reduce((a, b) => b.count > a.count ? b : a); mx.count--; p.count++; }
  }
}

/* 유형 개수를 파트별로 고르게 섞어서 나눔 */
function buildPlan() {
  const al = typeAlloc();
  const ids = Object.keys(al).filter(t => al[t] > 0), seq = [];
  const used = Object.fromEntries(ids.map(t => [t, 0]));
  const N = ids.reduce((a, t) => a + al[t], 0);
  for (let k = 0; k < N; k++) {
    let best = null, bs = -1;
    for (const t of ids) { if (used[t] >= al[t]) continue; const s = (al[t] - used[t]) / al[t]; if (s > bs) { bs = s; best = t; } }
    seq.push(best); used[best]++;
  }
  const plan = {}; let pos = 0;
  for (const p of S.parts) {
    const c = {};
    for (let k = 0; k < p.count; k++) { const t = seq[pos++] || ids[0] || 'mc'; c[t] = (c[t] || 0) + 1; }
    plan[p.id] = c;
  }
  return plan;
}
function splitChunks(counts, max) {
  const list = []; Object.entries(counts).forEach(([t, n]) => { for (let i = 0; i < n; i++) list.push(t); });
  const chunks = [];
  for (let i = 0; i < list.length; i += max) {
    const c = {}; list.slice(i, i + max).forEach(t => c[t] = (c[t] || 0) + 1); chunks.push(c);
  }
  return chunks;
}

    c.before(gridCol);

const SAFE_ID = v => (typeof v === 'string' && /^[a-z0-9]{4,24}$/.test(v)) ? v : uid();
const sv = (v, n = 5000) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, n);

           statements: arr(q.statements), rightItems: arr(q.rightItems), choices: arr(q.choices), answer: sv(q.answer, 1000),
           explanation: sv(q.explanation, 6000), concept: sv(q.concept, 200), difficulty: ['쉬움', '보통', '어려움'].includes(q.difficulty) ? q.difficulty : '' };

function sanitizeSettings(s) {

  const o = { total: iv(s.total, 1, 200, 20), typeMode: s.typeMode === 'manual' ? 'manual' : 'auto', typeCounts: {},
    difficulty: ['easy', 'normal', 'hard', 'mixed'].includes(s.difficulty) ? s.difficulty : 'mixed', style: STYLES[s.style] ? s.style : 'school',
    choiceN: +s.choiceN === 4 ? 4 : 5, explain: s.explain === 'brief' ? 'brief' : 'detail', layout: String(s.layout) === '1' ? '1' : '2',
    order: s.order === 'shuffle' ? 'shuffle' : 'part', title: sv(s.title, 200), showName: s.showName !== false, extra: sv(s.extra, 2000) };
  const types = (Array.isArray(s.types) ? s.types : []).filter(t => TYPE[t]);
  if (types.length) o.types = types;
  if (s.typeCounts && typeof s.typeCounts === 'object') Object.keys(TYPE).forEach(k => { if (s.typeCounts[k] != null) o.typeCounts[k] = iv(s.typeCounts[k], 0, 200, 0); });

function sanitizeSheet(d) {

  });

    <div class="mats">${d.materials.map(x => `<a class="mat" href="${esc(x.url || '#')}" target="_blank" rel="noopener">${/^image\//.test(x.mime) && x.url ? `<img src="${esc(x.url)}" alt="">` : `<span class="pdf">PDF</span>`}<span class="mn">${esc(x.name)}</span><span class="mi">${kb(x.size)} · ${esc(x.ip || '')}</span></a>`).join('') || '<p class="note">자료 없음</p>'}</div>
    <div class="sec-t">제작 파일 <small>학생이 저장·공유·인쇄한 PDF ${(d.exports || []).filter(x => x.uploaded).length}개</small></div>
    <div class="exps">${(d.exports || []).map(x => `<div class="exp ${x.uploaded ? '' : 'bad'}"><span class="ek">${({ download: '저장', share: '공유', print: '인쇄' })[x.kind] || '저장'}</span>
      <div class="em"><b>${esc(x.title || d.title || '문제지')}.pdf</b><span>${fmtDT(x.created_at)} · ${iv(x.pages, 0, 999, 0)}쪽 · ${kb(+x.size || 0)} · <code>${esc(x.ip || '-')}</code></span></div>
      ${x.uploaded && x.url ? `<a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">열기</a>` : '<span class="err" style="font-size:12.5px">업로드 안 됨</span>'}</div>`).join('') || '<p class="note">아직 PDF로 저장한 적이 없어요.</p>'}</div>
    ${data.memo ? `<div class="sec-t">AI에게 남긴 메모</div><p class="note">${esc(data.memo)}</p>` : ''}
    ${parts.length ? `<div class="sec-t">파트 분석</div><p class="note">${parts.map((p, i) => `${i + 1}. ${esc(p.title)} (${p.count}문항)`).join('<br>')}</p>` : ''}
    <div class="sec-t">만든 문제 <small>${n}개</small></div>
    ${qsHTML || '<p class="note">아직 만든 문제가 없어요.</p>'}
    <div class="sec-t">AI 사용 기록 <small>${d.logs.length}회</small></div>
    <div class="logs">${d.logs.map(g => `<details class="log ${g.ok === false ? 'bad' : ''}"><summary><span>${fmtDT(g.created_at)}</span><b>${kindL[g.kind] || esc(g.kind)}</b><code>${esc(g.ip || '-')}</code><em>${g.ok === false ? '실패' : g.ok ? '성공' : '진행중'}</em></summary>
      ${g.error ? `<pre class="err">${esc(g.error)}</pre>` : ''}<div class="lt">보낸 요청</div><pre>${esc((g.prompt || '').slice(0, 6000))}</pre>${g.response ? `<div class="lt">AI 응답 (${esc(g.model || '')})</div><pre>${esc(g.response.slice(0, 6000))}${g.response.length > 6000 ? '\n…' : ''}</pre>` : ''}</details>`).join('') || '<p class="note">기록 없음</p>'}</div>
    <div class="row" style="margin-top:16px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0"><button class="btn" data-close style="flex:1">닫기</button>${n ? '<button class="btn pri" id="adOpen" style="flex:2">이 문제지로 PDF 만들기</button>' : ''}</div>
  </div>`, 'wide');
  renderMath(m);
  const o = $('#adOpen', m); if (o) o.onclick = () => { m.remove(); applySheet(data, d.id, true); };
}

/* =============== 모달 / 로딩 =============== */
function modal(html, cls) {
  const m = document.createElement('div'); m.className = 'modal' + (cls ? ' ' + cls : '');
  m.innerHTML = `<div class="box">${html}</div>`;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); };
  document.body.append(m); return m;
}
function alertBox(title, html, btnLabel, btnFn) {
  const m = modal(`<h3>${esc(title)}</h3><p style="line-height:1.6;font-size:14.5px">${html}</p><div class="row" style="margin-top:14px">${btnLabel ? `<button class="btn" id="abX" style="flex:1">${esc(btnLabel)}</button>` : ''}<button class="btn pri" data-close style="flex:1">확인</button></div>`);
  if (btnLabel) $('#abX', m).onclick = () => { m.remove(); btnFn(); };
}
let loadEl = null;
function showLoading(title, detail, cancellable = true) {
  hideLoading();
  const ctl = new AbortController();
  loadEl = document.createElement('div'); loadEl.className = 'loading';
  loadEl.innerHTML = `<div class="lb2"><div class="spin"></div><div class="t">${esc(title)}</div><div class="d" id="ldD">${esc(detail || '')}</div><div class="prog" id="ldP" style="display:none"><i></i></div>${cancellable ? '<button class="btn sm" id="ldC" style="margin-top:20px">취소</button>' : ''}</div>`;
  loadEl.querySelector('.lb2').insertAdjacentHTML('beforeend', '<div class="tip">완료될 때까지 화면을 켜 두고 이 화면에 머물러 주세요.</div>');
  document.body.append(loadEl);
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wakeLock = w; }).catch(() => {}); } catch (e) {}
  const c = $('#ldC', loadEl); if (c) c.onclick = () => { ctl.abort(); hideLoading(); };
  ctl.detail = detail; return ctl;
}
let wakeLock = null;
function hideLoading() { if (loadEl) { loadEl.remove(); loadEl = null; } if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
function setLoadingDetail(t) { const d = loadEl && $('#ldD', loadEl); if (d) d.textContent = t; }
function setProgress(r) { const p = loadEl && $('#ldP', loadEl); if (p) { p.style.display = ''; $('i', p).style.width = Math.round(r * 100) + '%'; } }

/* =============== 시작 =============== */
$('#brand').onclick = e => { e.preventDefault(); if (S.step === 1) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } if (S.step !== 1 && !confirm('처음 화면으로 갈까요? (만든 문제지는 [내 문제지]에 있어요)')) return; S = freshState(); render(); };
window.addEventListener('beforeunload', e => { if (S.files.length && !allQuestions().length) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { if (S.step === 5 && S.pages) showPreview(); });
window.addEventListener('DOMContentLoaded', async () => {
  render();
  if (CONFIGURED && TOKEN) { await refreshMe(); render(); }
  // 수식 글꼴 미리 불러오기
  try { const w = document.createElement('span'); w.style.cssText = 'position:fixed;left:-9999px'; w.textContent = '$x^2$'; document.body.append(w); renderMath(w); setTimeout(() => w.remove(), 3000); } catch (e) {}
});
</script>
