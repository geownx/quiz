<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈 · 문제지메이커</title>
<meta name="description" content="문제지메이커: 사진으로 문제지 만들기, 공부 체크리스트, 공부 타이머, 급식·시간표까지 한곳에서.">
<meta name="theme-color" content="#f6f7fb">
<meta property="og:type" content="website">
<meta property="og:site_name" content="문제지메이커">
<meta property="og:title" content="문제지메이커">
<meta property="og:description" content="사진으로 문제지 만들기, 체크리스트, 공부 타이머, 급식·시간표까지 한곳에서.">
<meta property="og:url" content="https://quizmaker.pro/tools/">
<meta property="og:image" content="https://quizmaker.pro/og.png?v=2">
<link rel="manifest" href="/tools/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/tools/icons/icon-192.png">
<link rel="apple-touch-icon" href="/tools/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문제지메이커">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/tools/common.css">
<link rel="stylesheet" href="/tools/nav.css">
<style>
.hi{font-size:15px;color:var(--mute);font-weight:600;margin:0 0 4px}
.hi b{color:var(--ink)}
/* 문제지 만들기 */
.mk{border-radius:18px;padding:18px;margin-bottom:6px;color:#fff;background:linear-gradient(135deg,#5b6cff,#8462ff)}
.mk h2{color:#fff;font-size:20px;margin:0 0 4px;letter-spacing:-.5px}
.mk p{margin:0 0 14px;font-size:13.5px;line-height:1.55;opacity:.9;word-break:keep-all}
.mk .row{gap:8px}
.mk .btn{border:0;font-weight:800;padding:11px 16px;border-radius:12px}
.mk .b1{background:#fff;color:#4b54d8}
.mk .b2{background:rgba(255,255,255,.18);color:#fff}
/* 이어서 하기 */
.rc{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;scrollbar-width:none}
.rc::-webkit-scrollbar{display:none}
.rci{flex:0 0 auto;width:190px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.rci .tg{align-self:flex-start;font-size:11px;font-weight:800;color:var(--mute)}
.rci .tg.go,.rci .tg.run{color:var(--acc)}
.rci b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rci small{font-size:12px;color:var(--mute)}
.rci .pb{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.rci .pb i{display:block;height:100%;background:var(--acc)}
.rci.more{width:96px;align-items:center;justify-content:center;font-weight:800;color:var(--acc);border-style:dashed}
/* 오늘 */
.today{padding:16px 16px 6px}
.today .th{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.today .th b{font-size:17px}
.today .th span{font-size:13px;color:var(--mute);font-weight:600}
.today .th em{margin-left:auto;font-style:normal;font-weight:800;color:var(--acc);font-size:15px}
.today .bar{margin-bottom:6px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);background:none;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;padding:0}
.mini li.done .ck{background:var(--c);border-color:var(--c)}
.mini .t{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini li.done .t{text-decoration:line-through;color:var(--mute)}
.mini .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
.empty3{color:var(--mute);font-size:14px;margin:6px 0}
.more2{display:block;text-align:right;padding:6px 0 10px;font-weight:700;font-size:13px;color:var(--acc);text-decoration:none}
.sl1{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);text-decoration:none;line-height:1.5}
.sl1 span{flex:0 0 42px;color:var(--mute);font-weight:700}
.ddx{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.ddx div{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline}
.ddx b{color:var(--acc);font-size:15px}
.ddx span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk1{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding:11px 0;text-decoration:none;color:var(--ink);font-size:13.5px}
.wk1 span{color:var(--mute);font-weight:700}
.wk1 b{font-size:15px}
.wk1 em{font-style:normal;font-size:12px;font-weight:700}
.wk1 u{margin-left:auto;text-decoration:none;color:var(--acc);font-weight:700;font-size:13px}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* 배치: 폰·패드는 위아래, 컴퓨터는 좌우 */
.hm>*{min-width:0}
@media(min-width:1024px){.hm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}.mk{padding:24px}.mk h2{font-size:23px}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/tools/nav.js"></script>
<script src="/tools/common.js"></script>
<script src="/tools/checklist/data.js"></script>
<script src="/tools/school/school.js"></script>
<script src="/tools/timer/timer.js"></script>
<script>
'use strict';
const { $, $$, esc, toast, CL, SC, TM, LS } = QT;
const H = { subs: [], tasks: [], ses: [], loaded: false };
const subColor = id => (H.subs.find(s => s.id === id) || { color: '#8a8f9c' }).color;
const CAM = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';

function shell(me) {
  const hour = new Date().getHours(), hi = hour < 6 ? '늦은 밤이에요' : hour < 12 ? '좋은 아침이에요' : hour < 18 ? '오늘도 화이팅' : '오늘 하루 마무리해요';
  $('#app').innerHTML = `<div class="wrap">
    <p class="hi">${me.name ? `<b>${esc(me.name)}</b>님, ` : ''}${hi}</p>
    <div id="runbar"></div>
    <div class="hm">
      <div class="h-a">
        <div class="mk"><h2>사진 찍으면 바로 문제지</h2><p>교과서·필기 사진이나 PDF를 올리면 문제지, 풀기·채점, 플래시카드까지 만들어 줘요.</p>
          <div class="row"><a class="btn b1" href="/#/lib/cam">${CAM} 사진 찍기</a><a class="btn b2" href="/#/lib/file">파일 올리기</a></div></div>
        <div class="sec-t" style="margin-top:4px">이어서 하기</div>
        <div class="rc" id="rc"><div class="rci"><small>불러오는 중…</small></div></div>
      </div>
      <div class="card today h-b"><div id="tdHead"></div><div id="tdList"></div><div id="tdSchool"></div><div id="tdWeek"></div></div>
    </div>
    <div id="inst"></div>
  </div>`;
  QT.installCard($('#inst'));
  QT.timerBanner($('#runbar'));
}

/* ---------- 오늘 할 일 ---------- */
function drawToday() {
  const all = H.tasks, done = all.filter(t => t.done).length, pct = all.length ? Math.round(done / all.length * 100) : 0;
  const shown = all.slice().sort((a, b) => a.done - b.done).slice(0, 4);
  $('#tdHead').innerHTML = `<div class="th"><b>오늘</b><span>${QT.prettyDate(QT.todayKey()).main}</span><em>${all.length ? `${done}/${all.length}` : ''}</em></div>${all.length ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}`;
  $('#tdList').innerHTML = (!H.loaded && !all.length ? '<p class="empty3">불러오는 중…</p>'
      : all.length ? `<ul class="mini">${shown.map(t => `<li class="${t.done ? 'done' : ''}" data-id="${t.id}" style="--c:${subColor(t.subject_id)}"><button class="ck" aria-label="완료">${t.done ? '✓' : ''}</button><span class="t">${esc(t.title)}</span><span class="dot"></span></li>`).join('')}</ul>`
      : '<p class="empty3">오늘 할 일이 없어요</p>')
    + `<a class="more2" href="/tools/checklist/">${all.length > shown.length ? `+${all.length - shown.length}개 더 · ` : ''}${all.length ? '할 일 전체' : '할 일 적기'} →</a>`;
  $$('#tdList .mini li').forEach(li => $('.ck', li).onclick = async () => {
    const t = H.tasks.find(x => x.id === li.dataset.id); if (!t) return;
    t.done = !t.done; drawToday();
    try { await CL.setDone(t.id, t.done); CL.cache.set('day_' + QT.todayKey(), H.tasks); if (t.done && H.tasks.every(x => x.done)) toast('🎉 오늘 할 일 전부 완료!'); }
    catch (e) { t.done = !t.done; drawToday(); toast(CL.errMsg(e), 3500); }
  });
}

/* ---------- 이번 주 리포트 ---------- */
const W = { ses: null, prev: null };
function drawReport() {
  const box = $('#tdWeek'); if (!box || !W.ses) return;
  const sec = TM.sum(W.ses), diff = sec - TM.sum(W.prev || []);
  box.innerHTML = `<a class="wk1" href="/tools/timer/?tab=stats"><span>이번 주 공부</span><b>${TM.dur(sec)}</b>${sec || W.prev.length ? `<em class="${diff >= 0 ? 'up' : 'dn'}">지난주 ${diff >= 0 ? '+' : '−'}${TM.dur(Math.abs(diff))}</em>` : ''}<u>기록 →</u></a>`;
}
async function loadReport() {
  const t = QT.todayKey(), wk = SC.weekRange(t), pm = QT.shiftKey(wk.mon, -7);
  try { const [cur, prev] = await Promise.all([TM.sessions(wk.mon, t), TM.sessions(pm, QT.shiftKey(pm, (QT.parseKey(t).getDay() + 6) % 7))]); Object.assign(W, { ses: cur, prev }); }
  catch (e) { W.ses = []; W.prev = []; }
  drawReport();
}

/* ---------- 이어서 풀기 · 최근 학습 (문제지메이커) ---------- */
async function loadRecent() {
  const box = $('#rc'), cards = [];
  // 풀다 만 문제지: 이 기기에 남아 있는 답안
  const ids = [];
  try { Object.keys(localStorage).forEach(k => { const m = k.match(/^qm_(ans|one)_([a-z0-9-]{3,})$/i); if (!m || ids.includes(m[2])) return; const v = LS.get(k, null); if (v && (m[1] === 'one' || Object.keys(v).length)) ids.push(m[2]); }); } catch (e) {}
  const outs = await Promise.all(ids.slice(0, 3).map(id => QT.api('outputGet', { outputId: id }).then(o => ({ o, id })).catch(() => null)));
  outs.filter(Boolean).forEach(({ o, id }) => {
    const total = Object.values((o.data && o.data.qByPart) || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
    const ans = Object.keys(LS.get('qm_ans_' + id, {}) || {}).length, one = LS.get('qm_one_' + id, null), done = one ? Math.max(ans, (one.idx || 0)) : ans;
    cards.push(`<a class="rci" href="/#/solve/${esc(id)}"><span class="tg go">이어서 풀기</span><b>${esc(o.title || '문제지')}</b><small>${esc((o.item && o.item.title) || '')} · ${done}/${total || '?'} 답함</small><span class="pb"><i style="width:${total ? Math.min(100, done / total * 100) : 0}%"></i></span></a>`);
  });
  let items = [];
  try { items = await QT.api('items'); } catch (e) { if (!cards.length) { box.innerHTML = `<div class="rci"><small>${esc(e.message)}</small></div>`; return; } }
  items.slice(0, 4).forEach(x => cards.push(`<a class="rci" href="/#/item/${esc(x.id)}"><span class="tg ${x.status === 'analyzing' || x.running ? 'run' : ''}">${x.status === 'analyzing' ? '분석 중' : x.running ? '만드는 중' : '학습'}</span><b>${esc(x.title)}</b><small>${x.subject && x.subject !== x.title ? esc(x.subject) + ' · ' : ''}만든 것 ${x.outputs || 0}개</small></a>`));
  box.innerHTML = cards.length ? cards.join('') + `<a class="rci more" href="/#/lib">전체 →</a>`
    : `<a class="rci" href="/#/lib/cam" style="width:100%"><span class="tg go">처음이라면</span><b>첫 학습을 만들어 보세요</b><small>사진 한 장이면 문제지가 나와요</small></a>`;
}

/* ---------- 오늘 학교 + 가까운 시험 ---------- */
/* 가까운 시험 D-day 한 줄 (시간표 · 급식은 학교 탭에서) */
async function drawSchool() {
  const box = $('#tdSchool'), p = SC.cache.get('profile'), t = QT.todayKey();
  let dd = [], ex = [];
  await Promise.all([
    SC.ddays().then(r => dd = r).catch(() => {}),
    p && p.school_code ? SC.schedule(p, t, QT.shiftKey(t, 200)).then(r => ex = SC.exams(r)).catch(() => {}) : null,
  ]);
  const next = [...ex.filter(e => e.day >= t), ...dd.filter(d => d.day >= t)].sort((a, b) => a.day < b.day ? -1 : 1)[0];
  box.innerHTML = next ? `<div class="ddx"><div><b>${SC.dLabel(next.day)}</b><span>${esc(next.title)}</span></div>${(next.auto || /고사|시험|모의|수능|평가/.test(next.title)) ? '<button class="btn sm acc" id="exBtn">대비 문제지</button>' : ''}</div>` : '';
  const b = $('#exBtn'); if (b) b.onclick = () => QT.examPicker(next.title);
}

async function load() {
  const t = QT.todayKey();
  try { [H.subs, H.tasks] = await Promise.all([CL.subjects(), CL.tasks(t)]); H.loaded = true; drawToday(); }
  catch (e) { H.loaded = true; drawToday(); toast(CL.errMsg(e), 4000); }
  loadReport();
}
(async () => {
  QT.registerSW();
  const ctx = await QT.boot('hub'); if (!ctx) return;
  CL.init(ctx.user.id); SC.init(ctx.user.id); TM.init(ctx.user.id);
  H.subs = CL.cache.get('subjects', []); H.tasks = CL.cache.get('day_' + QT.todayKey(), []);
  shell(ctx.me); drawToday(); drawSchool();
  load(); loadRecent();
  SC.profile().then(p => { if (p) drawSchool(); }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
})();
</script>
</body>
</html>
